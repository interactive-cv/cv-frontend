name: deploy frontend to prod

# Автодеплой frontend при merge feature-ветки в master.
# Пересобирает только nextjs-контейнер (backend не трогает).
#
# Требует Secrets (те же что и в cv-backend):
#   DEPLOY_SSH_KEY, DEPLOY_HOST, DEPLOY_USER, PERSONAL_ICON_B64

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout cv-frontend
        uses: actions/checkout@v5

      # public/ может быть пустой в git — Dockerfile nextjs требует её существования.
      - name: Ensure public/ exists
        run: mkdir -p public

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Install personal icon (base64 → icon.png)
        if: ${{ env.PERSONAL_ICON_B64 != '' }}
        env:
          PERSONAL_ICON_B64: ${{ secrets.PERSONAL_ICON_B64 }}
        run: |
          if [ -n "$PERSONAL_ICON_B64" ]; then
            echo "$PERSONAL_ICON_B64" | base64 -d > app/icon.png
            echo "✓ Личная иконка установлена"
          else
            echo "— PERSONAL_ICON_B64 не задан, остаётся open-source default"
          fi

      - name: rsync cv-frontend → VPS
        run: |
          rsync -az --delete \
            --exclude='node_modules' --exclude='.next' --exclude='.git' --exclude='.cache' \
            --exclude='app/icon.personal.png' \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./ ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/home/deploy/libera_cv/cv-frontend/

      - name: Deploy nextjs on VPS (detached)
        # Как в cv-backend: деплой запускается nohup'ом на сервере
        # (deploy/deploy-nextjs.sh), результат опрашивается короткими сессиями.
        # Долгая ssh-сессия раннер(US)→VPS(РФ) рвётся по транзиту, а её команда
        # оставалась на сервере — и потом останавливала уже поднятое.
        # Скрипт сначала собирает образ и лишь затем пересоздаёт контейнер:
        # на время сборки прод работает на прежнем.
        # Лог: /tmp/deploy_frontend_ci.log. Ждём до 45 минут.
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -o ConnectTimeout=20 ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}"
          $SSH 'rm -f /tmp/deploy_frontend_ci.done /tmp/deploy_frontend_ci.log; nohup bash -c "bash /home/deploy/libera_cv/cv-frontend/deploy/deploy-nextjs.sh > /tmp/deploy_frontend_ci.log 2>&1; echo \$? > /tmp/deploy_frontend_ci.done" >/dev/null 2>&1 & echo launched'
          rc=""
          for i in $(seq 1 270); do
            sleep 10
            rc=$($SSH 'cat /tmp/deploy_frontend_ci.done 2>/dev/null || true' 2>/dev/null || true)
            if [ -n "$rc" ]; then break; fi
          done
          $SSH 'tail -40 /tmp/deploy_frontend_ci.log 2>/dev/null' || true
          if [ -z "$rc" ]; then
            echo "⏳ деплой ещё выполняется на сервере — прод работает на прежней версии. Лог на VPS: /tmp/deploy_frontend_ci.log"
            exit 1
          fi
          if [ "$rc" != "0" ]; then
            echo "❌ deploy failed (rc=$rc). Прод остаётся на прежней версии, если сбой был до переключения."
            exit 1
          fi
          echo "✅ deploy OK"
      - name: Smoke test
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -sf https://cv.libera.pro | grep -q '<html'; then
              echo "✅ frontend деплой завершён"
              exit 0
            fi
            echo "Попытка $i — не готово, ждём..."
            sleep 5
          done
          echo "❌ smoke failed"
          exit 1
